name: Debug fetch (temporary)
on:
  push:
    branches: [claude/reeder-hada-forbidden-error-fjy2xh]
    paths: ['.github/workflows/debug-fetch.yml']
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch samples
        run: |
          mkdir -p debug
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          curl -sSL -A "$UA" -o debug/theqoo-list.html "https://theqoo.net/square"
          curl -sSL -A "$UA" -o debug/theqoo-post.html "https://theqoo.net/square/4369549137"
          {
            for u in $(grep -oE '(src|data-src|data-original)="[^"]+"' debug/theqoo-post.html | grep -iE 'jpe?g|png|gif|webp|mp4|img' | sed -E 's/^[^"]*"//; s/"$//' | sed 's#^//#https://#' | sort -u | head -8); do
              echo "== $u"
              echo -n "noref: "; curl -s -o /dev/null -w "%{http_code} %{content_type}\n" -A "$UA" "$u"
              echo -n "reeder-ua noref: "; curl -s -o /dev/null -w "%{http_code} %{content_type}\n" -A "Reeder/5.0" "$u"
              echo -n "ref theqoo: "; curl -s -o /dev/null -w "%{http_code} %{content_type}\n" -A "$UA" -e "https://theqoo.net/" "$u"
              echo -n "ref other: "; curl -s -o /dev/null -w "%{http_code} %{content_type}\n" -A "$UA" -e "https://example.com/" "$u"
            done
            echo "== post page with Reeder UA"
            curl -s -o /dev/null -w "%{http_code}\n" -A "Reeder/5.0" "https://theqoo.net/square/4369549137"
          } > debug/media-check.txt 2>&1
          git config user.name "FeedForge Bot"
          git config user.email "feedforge-bot@users.noreply.github.com"
          git add -f debug/
          git commit -m "chore: debug samples [skip ci]" && git push
